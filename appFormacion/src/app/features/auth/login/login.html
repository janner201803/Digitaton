<main class="auth-page login-page">

  <section class="story-panel" aria-label="Bienvenida">
    <a class="brand" routerLink="/login" aria-label="Universidad Autónoma de Occidente">
      <img class="brand-logo" src="/img/logo.png" alt="Universidad Autónoma de Occidente">
    </a>

    <div class="story-visual" aria-hidden="true">
      <img class="story-city" src="/img/ciudadCaos.jpg" alt="">
      <img class="story-city-future" src="/img/ciudadPerfecta.jpg" alt="">
      <span class="story-divider"></span>
      <img class="story-character" src="/img/personaje.png" alt="">
    </div>

    <div class="story-text">
      <h1>Un viaje por el <em>Pluralismo</em></h1>
      <p>Aprende, reflexiona y construye una sociedad más justa, consciente e inclusiva.</p>
      <a class="story-cta" href="#login-form" (click)="irAlFormulario($event)">
        Comenzar aventura <span class="arrow" aria-hidden="true">▶</span>
      </a>
    </div>
  </section>

  <section class="form-panel" id="login-form">
    <div class="form-card">

      <a class="brand brand-mobile" routerLink="/login" aria-label="UAO">
        <img class="brand-logo" src="/img/logo.png" alt="">
        <span class="brand-name"><strong>UAO</strong><small>Ciudadanía que transforma</small></span>
      </a>

      <div class="form-heading">
        <h2>¡Hola de nuevo!</h2>
        <p>Ingresa a tu cuenta y continúa tu recorrido de aprendizaje.</p>
      </div>

      <form (ngSubmit)="iniciarSesion()" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            (input)="limpiarError()"
            placeholder="nombre@correo.com"
            autocomplete="email"
            required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-container">
            <input
              [type]="mostrarPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              (input)="limpiarError()"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              required>
            <button
              type="button"
              class="toggle-password"
              (click)="mostrarPassword = !mostrarPassword"
              [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <p class="message error-message" *ngIf="mensajeError" role="alert">{{ mensajeError }}</p>

        <button type="submit" class="submit-button" [disabled]="cargando">
          {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }} <span class="arrow" aria-hidden="true">▶</span>
        </button>
      </form>

      <p class="auth-switch">¿Aún no tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
    </div>
  </section>
</main>
